name: Update GitHub Highlights

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
      - scripts/**
      - README.md

permissions:
  contents: write

concurrency:
  group: github-highlights
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch public GitHub statistics
        run: node scripts/update-highlights.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
          PROFILE_OUTPUT_DIR: dist

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1687D9&color_dots=#ebedf0,#bfe3f7,#7cc4ee,#3a9fe0,#1272bd
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7CE4CF&color_dots=#161b22,#0f3550,#14608f,#2a9be0,#7cd4f7

      - name: Publish generated assets to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
