name: Update GitHub Highlights

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
      - scripts/**
      - README.md

permissions:
  contents: write

concurrency:
  group: github-highlights
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch public GitHub statistics
        run: node scripts/update-highlights.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=#1687D9
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#48B7FF

      - name: Link generated animation in README
        run: node scripts/link-snake.mjs

      - name: Save refreshed highlights
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/github-highlights.svg assets/github-highlights-mobile.svg assets/github-highlights.json assets/github-contribution-grid-snake*.svg
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'chore: refresh GitHub highlights [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
