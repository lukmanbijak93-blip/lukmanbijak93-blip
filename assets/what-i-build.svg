<text x="78" y="40" font-size="19" font-weight="700" fill="#f2f8fc">Data Processing Tools</text><text x="446" y="38" font-size="12" fill="#86a3b8" text-anchor="end" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace">04</text>
<text x="78" y="64" font-size="14.5" fill="#b7cbda">Validasi, rekonsiliasi, konversi,</text><text x="78" y="85" font-size="14.5" fill="#b7cbda">dan pemindahan data antar sistem.</text>
