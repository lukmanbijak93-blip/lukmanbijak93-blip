<circle cx="29" cy="127" r="9" fill="#7ce4cf" fill-opacity=".14"/><g transform="translate(24 122) scale(0.4167)" fill="none" stroke="#7ce4cf" stroke-width="4.32" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g><text x="47" y="131.5" font-size="13.5" fill="#a5e6dc">Data terhubung, input berulang berkurang</text>
</g></g>
