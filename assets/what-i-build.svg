<circle cx="29" cy="127" r="9" fill="#7ce4cf" fill-opacity=".14"/><g transform="translate(24 122) scale(0.4167)" fill="none" stroke="#7ce4cf" stroke-width="4.32" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g><text x="47" y="131.5" font-size="13.5" fill="#a5e6dc">Data lebih konsisten dan siap digunakan</text>
</g></g>
<g transform="translate(24 356)"><g class="in" style="animation-delay:0.36s">
<rect width="952" height="128" rx="14" fill="url(#cf)" stroke="url(#csf)"/>
<rect x="20" y="20" width="44" height="44" rx="12" fill="#143a52" stroke="#25566f"/><g transform="translate(31 31) scale(0.9167)" fill="none" stroke="#7ce4cf" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></g>
<text x="78" y="40" font-size="19" font-weight="700" fill="#f2f8fc">Workflow Automation</text><text x="446" y="38" font-size="12" fill="#86a3b8" text-anchor="end" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace">05</text>
<text x="78" y="64" font-size="14.5" fill="#c7dce6">Tugas terjadwal, sinkronisasi, dan pelaporan</text><text x="78" y="85" font-size="14.5" fill="#c7dce6">berjalan dengan aturan validasi yang jelas.</text>
