<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="title desc">
<title id="title">Mari berdiskusi</title>
<desc id="desc">Ingin mengintegrasikan Accurate Online atau menyederhanakan proses bisnis Anda? Ceritakan alur kerja Anda dan bagian yang ingin diperbaiki. Chat via WhatsApp: 0812-8552-5538.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06121f"/><stop offset="1" stop-color="#0c2539"/></linearGradient>
<linearGradient id="ac" x2="1"><stop stop-color="#45b9f7"/><stop offset="1" stop-color="#7ce4cf"/></linearGradient>
<linearGradient id="cs" x2="0" y2="1"><stop stop-color="#2f5d79"/><stop offset="1" stop-color="#1b3a51"/></linearGradient>
<linearGradient id="csf" x2="0" y2="1"><stop stop-color="#4f9bb0"/><stop offset="1" stop-color="#28607a"/></linearGradient>
<linearGradient id="cf" x2="1"><stop stop-color="#12364d"/><stop offset="1" stop-color="#0f2c42"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#2f8fc0" stop-opacity=".3"/><stop offset="1" stop-color="#2f8fc0" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#a6d8ec" fill-opacity=".13"/></pattern>
<linearGradient id="fade" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".75" stop-color="#fff" stop-opacity=".1"/></linearGradient>
<mask id="fm"><rect width="1000" height="180" fill="url(#fade)"/></mask>
<clipPath id="clip"><rect width="1000" height="180" rx="20"/></clipPath>
</defs>
<style>.in{animation:in .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.55}70%,to{transform:scale(2.9);opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) .3s both}
@keyframes grow{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.nudge{animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px)}}</style>
<g clip-path="url(#clip)">
<rect width="1000" height="180" fill="url(#bg)"/>
<rect width="1000" height="180" fill="url(#dots)" mask="url(#fm)"/>
<circle cx="860" cy="90" r="300" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="999" height="179" rx="19.5" fill="none" stroke="#1e3d56"/>
<g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<g class="in">
<circle cx="30" cy="39.5" r="3.5" fill="#7ce4cf" class="ping"/><circle cx="30" cy="39.5" r="3.5" fill="#7ce4cf"/><text x="44" y="44" font-size="11.5" font-weight="700" fill="#7ce4cf" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">MARI BERDISKUSI</text>
<text x="24" y="84" font-size="25" font-weight="700" fill="#f2f8fc" letter-spacing="-0.2">Ingin mengintegrasikan Accurate Online</text>
<text x="24" y="116" font-size="25" font-weight="700" fill="#f2f8fc" letter-spacing="-0.2">atau menyederhanakan proses bisnis Anda?</text>
<text x="24" y="149" font-size="15" fill="#b7cbda">Ceritakan alur kerja Anda dan bagian yang ingin diperbaiki.</text>
</g>
<g class="in" style="animation-delay:0.15s"><rect x="704" y="58" width="268" height="54" rx="27" fill="url(#ac)"/>
<g transform="translate(738 75) scale(0.8333)" fill="none" stroke="#052033" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></g>
<text x="836" y="90.5" font-size="16" font-weight="700" fill="#052033" text-anchor="middle">Chat via WhatsApp</text>
<g class="nudge"><g transform="translate(914 76) scale(0.75)" fill="none" stroke="#052033" stroke-width="2.93" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></g></g>
<text x="838" y="138" font-size="12.5" fill="#86a3b8" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1">0812-8552-5538</text></g>
</g>
</svg>
