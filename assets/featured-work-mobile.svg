<text x="18" y="98" font-size="11" font-weight="700" fill="#86a3b8" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">SEBELUM</text><text x="18" y="120" font-size="14.5" fill="#b7cbda">Rekap manual di Excel setiap akhir bulan.</text>
<text x="18" y="148" font-size="11" font-weight="700" fill="#7ce4cf" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">SESUDAH</text><text x="18" y="170" font-size="14.5" fill="#a5e6dc">Laporan siap kapan saja dari sumbernya.</text>
</g></g>
