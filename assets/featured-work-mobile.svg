<rect x="18" y="18" width="40" height="40" rx="11" fill="#143a52" stroke="#25566f"/><g transform="translate(28 28) scale(0.8333)" fill="none" stroke="#7ce4cf" stroke-width="2.04" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></g>
<text x="70" y="44" font-size="18" font-weight="700" fill="#f2f8fc">Pekerjaan Otomatis</text>
<path d="M18 74.5H382" stroke="#234861"/>
<text x="18" y="98" font-size="11" font-weight="700" fill="#86a3b8" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">SEBELUM</text><text x="18" y="120" font-size="14.5" fill="#b7cbda">Import, rekap, dan notifikasi manual.</text>
<text x="18" y="148" font-size="11" font-weight="700" fill="#7ce4cf" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">SESUDAH</text><text x="18" y="170" font-size="14.5" fill="#a5e6dc">Berjalan terjadwal, tim fokus ke keputusan.</text>
</g></g>
</g>
