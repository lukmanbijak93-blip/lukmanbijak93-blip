<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="GitHub activity animation">
  <rect width="900" height="180" rx="12" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="28" y="38" font-size="14" font-weight="700" fill="#111827" letter-spacing="1.2">GITHUB ACTIVITY</text>
