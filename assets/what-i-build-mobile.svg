<text x="70" y="44" font-size="18" font-weight="700" fill="#f2f8fc">Reporting &amp; Dashboards</text>
<text x="18" y="84" font-size="15" fill="#b7cbda">Laporan keuangan dan operasional</text><text x="18" y="106" font-size="15" fill="#b7cbda">yang mudah dipantau.</text>
<path d="M18 120.5H382" stroke="#234861"/>
