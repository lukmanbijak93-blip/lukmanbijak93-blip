<text x="70" y="44" font-size="18" font-weight="700" fill="#f2f8fc">Workflow Automation</text>
<text x="18" y="84" font-size="15" fill="#b7cbda">Tugas terjadwal, sinkronisasi,</text><text x="18" y="106" font-size="15" fill="#b7cbda">dan pelaporan dengan validasi.</text>
<path d="M18 120.5H382" stroke="#3a7189"/>
<circle cx="27" cy="138" r="9" fill="#7ce4cf" fill-opacity=".14"/><g transform="translate(22 133) scale(0.4167)" fill="none" stroke="#7ce4cf" stroke-width="4.32" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g><text x="45" y="142.5" font-size="13.5" fill="#a5e6dc">Lebih sedikit langkah manual</text>
