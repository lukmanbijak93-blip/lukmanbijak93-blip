      <path d="M17 113H383" stroke="#42718a"/>
      <circle cx="23" cy="132" r="3" fill="#83e3cc"/>
      <text x="35" y="137" fill="#a3ebdc" font-size="14">Lebih sedikit langkah manual</text>
