<text x="70" y="44" font-size="18" font-weight="700" fill="#f2f8fc">Data Processing Tools</text>
<text x="18" y="84" font-size="15" fill="#b7cbda">Validasi, rekonsiliasi, konversi,</text><text x="18" y="106" font-size="15" fill="#b7cbda">dan pemindahan data antar sistem.</text>
<path d="M18 120.5H382" stroke="#234861"/>
<circle cx="27" cy="138" r="9" fill="#7ce4cf" fill-opacity=".14"/><g transform="translate(22 133) scale(0.4167)" fill="none" stroke="#7ce4cf" stroke-width="4.32" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g><text x="45" y="142.5" font-size="13.5" fill="#a5e6dc">Data konsisten dan siap digunakan</text>
</g></g>
<g transform="translate(20 692)"><g class="in" style="animation-delay:0.36s">
