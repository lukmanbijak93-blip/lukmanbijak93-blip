<svg xmlns="http://www.w3.org/2000/svg" width="440" height="858" viewBox="0 0 440 858" role="img" aria-labelledby="title desc">
  <title id="title">What I Build — solusi sistem bisnis</title>
  <desc id="desc">Lima solusi: aplikasi bisnis, integrasi Accurate Online, laporan dan dashboard, alat pengolahan data, serta otomatisasi workflow. Solusi dirancang untuk membuat pekerjaan lebih jelas, data lebih konsisten, dan mengurangi langkah manual.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071527"/><stop offset="1" stop-color="#10334a"/></linearGradient></defs>
  <rect width="440" height="858" rx="20" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(20 20)">
      <rect width="400" height="154" rx="15" fill="#102d43" stroke="#31566e"/>
      <rect x="17" y="18" width="30" height="26" rx="8" fill="#1a4b62"/>
      <text x="32" y="36" text-anchor="middle" fill="#83e3cc" font-size="12" font-weight="700">01</text>
      <text x="57" y="38" fill="#f3f9fd" font-size="19" font-weight="700">Business Applications</text>
      <text x="17" y="74" fill="#bbd3e0" font-size="15">Aplikasi web untuk aktivitas operasional</text>
      <text x="17" y="96" fill="#bbd3e0" font-size="15">dalam alur kerja yang terstruktur.</text>
      <path d="M17 113H383" stroke="#31566e"/>
      <circle cx="23" cy="132" r="3" fill="#83e3cc"/>
      <text x="35" y="137" fill="#91ddda" font-size="14">Pekerjaan harian lebih jelas</text>
    </g>
    <g transform="translate(20 186)">
      <rect width="400" height="154" rx="15" fill="#102d43" stroke="#31566e"/>
      <rect x="17" y="18" width="30" height="26" rx="8" fill="#1a4b62"/>
      <text x="32" y="36" text-anchor="middle" fill="#83e3cc" font-size="12" font-weight="700">02</text>
      <text x="57" y="38" fill="#f3f9fd" font-size="18" font-weight="700">Accurate Online Integrations</text>
      <text x="17" y="74" fill="#bbd3e0" font-size="15">Hubungkan Accurate Online dengan</text>
      <text x="17" y="96" fill="#bbd3e0" font-size="15">aplikasi, Excel, dan platform lain.</text>
      <path d="M17 113H383" stroke="#31566e"/>
      <circle cx="23" cy="132" r="3" fill="#83e3cc"/>
      <text x="35" y="137" fill="#91ddda" font-size="14">Input berulang berkurang</text>
    </g>
    <g transform="translate(20 352)">
      <rect width="400" height="154" rx="15" fill="#102d43" stroke="#31566e"/>
      <rect x="17" y="18" width="30" height="26" rx="8" fill="#1a4b62"/>
      <text x="32" y="36" text-anchor="middle" fill="#83e3cc" font-size="12" font-weight="700">03</text>
      <text x="57" y="38" fill="#f3f9fd" font-size="19" font-weight="700">Reporting &amp; Dashboards</text>
      <text x="17" y="74" fill="#bbd3e0" font-size="15">Laporan keuangan dan operasional</text>
      <text x="17" y="96" fill="#bbd3e0" font-size="15">yang mudah dipantau.</text>
      <path d="M17 113H383" stroke="#31566e"/>
      <circle cx="23" cy="132" r="3" fill="#83e3cc"/>
      <text x="35" y="137" fill="#91ddda" font-size="14">Keputusan didukung data relevan</text>
    </g>
    <g transform="translate(20 518)">
      <rect width="400" height="154" rx="15" fill="#102d43" stroke="#31566e"/>
      <rect x="17" y="18" width="30" height="26" rx="8" fill="#1a4b62"/>
      <text x="32" y="36" text-anchor="middle" fill="#83e3cc" font-size="12" font-weight="700">04</text>
      <text x="57" y="38" fill="#f3f9fd" font-size="19" font-weight="700">Data Processing Tools</text>
      <text x="17" y="74" fill="#bbd3e0" font-size="15">Validasi, rekonsiliasi, konversi,</text>
      <text x="17" y="96" fill="#bbd3e0" font-size="15">dan pemindahan data antar sistem.</text>
      <path d="M17 113H383" stroke="#31566e"/>
      <circle cx="23" cy="132" r="3" fill="#83e3cc"/>
