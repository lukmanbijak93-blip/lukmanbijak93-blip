<path d="M18 120.5H382" stroke="#234861"/>
<circle cx="27" cy="138" r="9" fill="#7ce4cf" fill-opacity=".14"/><g transform="translate(22 133) scale(0.4167)" fill="none" stroke="#7ce4cf" stroke-width="4.32" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g><text x="45" y="142.5" font-size="13.5" fill="#a5e6dc">Pekerjaan harian lebih jelas</text>
</g></g>
