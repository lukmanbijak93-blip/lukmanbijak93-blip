<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Lukman Bijak Bestari</title>
<desc id="desc">Trainer Accurate Online dan developer sistem bisnis. Proses lebih jelas, data lebih terhubung. Fokus: integrasi API, otomatisasi, pelaporan, dan pelatihan.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06121f"/><stop offset="1" stop-color="#0c2539"/></linearGradient>
<linearGradient id="ac" x2="1"><stop stop-color="#45b9f7"/><stop offset="1" stop-color="#7ce4cf"/></linearGradient>
<linearGradient id="cs" x2="0" y2="1"><stop stop-color="#2f5d79"/><stop offset="1" stop-color="#1b3a51"/></linearGradient>
<linearGradient id="csf" x2="0" y2="1"><stop stop-color="#4f9bb0"/><stop offset="1" stop-color="#28607a"/></linearGradient>
<linearGradient id="cf" x2="1"><stop stop-color="#12364d"/><stop offset="1" stop-color="#0f2c42"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#2f8fc0" stop-opacity=".3"/><stop offset="1" stop-color="#2f8fc0" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#a6d8ec" fill-opacity=".13"/></pattern>
<linearGradient id="fade" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".75" stop-color="#fff" stop-opacity=".1"/></linearGradient>
<mask id="fm"><rect width="1200" height="360" fill="url(#fade)"/></mask>
<clipPath id="clip"><rect width="1200" height="360" rx="24"/></clipPath>
</defs>
<style>.in{animation:in .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.55}70%,to{transform:scale(2.9);opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) .3s both}
@keyframes grow{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.march{stroke-dasharray:.01 18;animation:march 1.5s linear infinite}
@keyframes march{to{stroke-dashoffset:-18.01}}
.spin{transform-origin:985px 180px;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hub{transform-box:fill-box;transform-origin:center;animation:hub 3.2s ease-out infinite}
@keyframes hub{0%{transform:scale(1);opacity:.5}70%,to{transform:scale(1.45);opacity:0}}</style>
<g clip-path="url(#clip)">
<rect width="1200" height="360" fill="url(#bg)"/>
<rect width="1200" height="360" fill="url(#dots)" mask="url(#fm)"/>
<circle cx="985" cy="180" r="330" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="1199" height="359" rx="23.5" fill="none" stroke="#1e3d56"/>
<g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<g fill="none" stroke="#7fd0e6">
<circle cx="985" cy="180" r="100" stroke-opacity=".12"/>
<circle cx="985" cy="180" r="157" stroke-opacity=".22" stroke-dasharray="2 10" class="spin"/>
</g>
<path d="M882 96C915 96 904 164 937 164" fill="none" stroke="#2c5d7a" stroke-width="1.2"/><path d="M882 96C915 96 904 164 937 164" fill="none" stroke="#45b9f7" stroke-width="3" stroke-linecap="round" class="march" style="animation-delay:0s"/>
<path d="M882 264C915 264 904 196 937 196" fill="none" stroke="#2c5d7a" stroke-width="1.2"/><path d="M882 264C915 264 904 196 937 196" fill="none" stroke="#45b9f7" stroke-width="3" stroke-linecap="round" class="march" style="animation-delay:-0.4s"/>
<path d="M1033 164C1066 164 1055 96 1088 96" fill="none" stroke="#2c5d7a" stroke-width="1.2"/><path d="M1033 164C1066 164 1055 96 1088 96" fill="none" stroke="#7ce4cf" stroke-width="3" stroke-linecap="round" class="march" style="animation-delay:-0.8s"/>
<path d="M1033 196C1066 196 1055 264 1088 264" fill="none" stroke="#2c5d7a" stroke-width="1.2"/><path d="M1033 196C1066 196 1055 264 1088 264" fill="none" stroke="#7ce4cf" stroke-width="3" stroke-linecap="round" class="march" style="animation-delay:-1.2s"/>
<rect x="937" y="132" width="96" height="96" rx="26" fill="none" stroke="#7ce4cf" stroke-width="1.5" class="hub"/>
<rect x="937" y="132" width="96" height="96" rx="26" fill="url(#cf)" stroke="url(#ac)" stroke-width="1.5"/>
<g transform="translate(967 162) scale(1.5)" fill="none" stroke="#f2f8fc" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></g>
<text x="985" y="254" font-size="10.5" font-weight="700" fill="#7ce4cf" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1">ACCURATE ONLINE</text>
<rect x="822" y="66" width="60" height="60" rx="17" fill="#0e273b" stroke="url(#cs)"/><g transform="translate(840 84) scale(1)" fill="none" stroke="#7ce4cf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 8h20M6 4v4M10 4v4"/></g><text x="852" y="145" font-size="10.5" fill="#86a3b8" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1">APLIKASI</text>
<rect x="822" y="234" width="60" height="60" rx="17" fill="#0e273b" stroke="url(#cs)"/><g transform="translate(840 252) scale(1)" fill="none" stroke="#7ce4cf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></g><text x="852" y="313" font-size="10.5" fill="#86a3b8" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1">EXCEL</text>
<rect x="1088" y="66" width="60" height="60" rx="17" fill="#0e273b" stroke="url(#cs)"/><g transform="translate(1106 84) scale(1)" fill="none" stroke="#7ce4cf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5M3 12a9 3 0 0 0 18 0"/></g><text x="1118" y="145" font-size="10.5" fill="#86a3b8" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1">DATABASE</text>
<rect x="1088" y="234" width="60" height="60" rx="17" fill="#0e273b" stroke="url(#cs)"/><g transform="translate(1106 252) scale(1)" fill="none" stroke="#7ce4cf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"/></g><text x="1118" y="313" font-size="10.5" fill="#86a3b8" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1">LAPORAN</text>
<g class="in">
<rect x="56" y="44" width="346" height="30" rx="15" fill="#0e273b" stroke="#234861"/>
<circle cx="73" cy="59" r="3.5" fill="#7ce4cf" class="ping"/><circle cx="73" cy="59" r="3.5" fill="#7ce4cf"/><text x="88" y="63.5" font-size="11.5" font-weight="700" fill="#b6e9ec" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1.4">BUSINESS SYSTEMS · DATA · AUTOMATION</text>
</g>
<g class="in" style="animation-delay:0.12s"><text x="54" y="150" font-size="56" font-weight="700" fill="#f2f8fc" letter-spacing="-0.6">Lukman Bijak Bestari</text></g>
<g class="in" style="animation-delay:0.24s">
<text x="56" y="193" font-size="21" fill="#b7cbda">Trainer Accurate Online &amp; Developer Sistem Bisnis</text>
<rect x="56" y="218" width="72" height="3" rx="1.5" fill="url(#ac)" class="grow"/>
</g>
<g class="in" style="animation-delay:0.36s">
<text x="56" y="261" font-size="17" fill="#d6e6f0">Proses lebih jelas. Data lebih terhubung.</text>
<g transform="translate(56 284)"><rect width="121" height="28" rx="14" fill="#0e273b" stroke="#234861"/><text x="60.5" y="18.68" font-size="13" font-weight="600" fill="#b7cbda" text-anchor="middle">Integrasi API</text></g><g transform="translate(185 284)"><rect width="107" height="28" rx="14" fill="#0e273b" stroke="#234861"/><text x="53.5" y="18.68" font-size="13" font-weight="600" fill="#b7cbda" text-anchor="middle">Otomatisasi</text></g><g transform="translate(300 284)"><rect width="92" height="28" rx="14" fill="#0e273b" stroke="#234861"/><text x="46" y="18.68" font-size="13" font-weight="600" fill="#b7cbda" text-anchor="middle">Pelaporan</text></g><g transform="translate(400 284)"><rect width="92" height="28" rx="14" fill="#0e273b" stroke="#234861"/><text x="46" y="18.68" font-size="13" font-weight="600" fill="#b7cbda" text-anchor="middle">Pelatihan</text></g>
</g>
</g>
</svg>
