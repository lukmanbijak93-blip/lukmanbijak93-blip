<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="174" viewBox="0 0 1000 174" role="img" aria-labelledby="title desc">
<title id="title">Dari proses bisnis menjadi solusi digital</title>
<desc id="desc">Empat tahap: pahami proses, hubungkan sistem, otomatisasi pekerjaan, evaluasi hasil.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06121f"/><stop offset="1" stop-color="#0c2539"/></linearGradient>
<linearGradient id="ac" x2="1"><stop stop-color="#45b9f7"/><stop offset="1" stop-color="#7ce4cf"/></linearGradient>
<linearGradient id="cs" x2="0" y2="1"><stop stop-color="#2f5d79"/><stop offset="1" stop-color="#1b3a51"/></linearGradient>
<linearGradient id="csf" x2="0" y2="1"><stop stop-color="#4f9bb0"/><stop offset="1" stop-color="#28607a"/></linearGradient>
<linearGradient id="cf" x2="1"><stop stop-color="#12364d"/><stop offset="1" stop-color="#0f2c42"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#2f8fc0" stop-opacity=".3"/><stop offset="1" stop-color="#2f8fc0" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#a6d8ec" fill-opacity=".13"/></pattern>
<linearGradient id="fade" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".75" stop-color="#fff" stop-opacity=".1"/></linearGradient>
<mask id="fm"><rect width="1000" height="174" fill="url(#fade)"/></mask>
<clipPath id="clip"><rect width="1000" height="174" rx="18"/></clipPath>
</defs>
<style>.in{animation:in .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.55}70%,to{transform:scale(2.9);opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) .3s both}
@keyframes grow{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.draw{stroke-dasharray:750;animation:draw 1.8s ease-out both}
@keyframes draw{from{stroke-dashoffset:750}}
.run{animation:run 6s linear infinite}
@keyframes run{0%{transform:translateX(0);opacity:0}4%{opacity:1}75%{transform:translateX(750px);opacity:1}80%,to{transform:translateX(750px);opacity:0}}
.halo{transform-box:fill-box;transform-origin:center;opacity:0;animation:halo 6s ease-out infinite}
@keyframes halo{0%{transform:scale(1);opacity:.75}22%,to{transform:scale(1.75);opacity:0}}</style>
<g clip-path="url(#clip)">
<rect width="1000" height="174" fill="url(#bg)"/>
<rect width="1000" height="174" fill="url(#dots)" mask="url(#fm)"/>
<circle cx="1000" cy="0" r="260" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="999" height="173" rx="17.5" fill="none" stroke="#1e3d56"/>
<g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<path d="M125 68H875" stroke="#234861" stroke-width="2"/>
<path d="M125 68H875" stroke="url(#ac)" stroke-width="2" stroke-opacity=".75" class="draw"/>
<g class="run" opacity="0"><circle cx="125" cy="68" r="9" fill="#7ce4cf" fill-opacity=".22"/><circle cx="125" cy="68" r="3.5" fill="#dffaf5"/></g>
<circle cx="125" cy="68" r="24" fill="none" stroke="#7ce4cf" stroke-width="1.5" class="halo" style="animation-delay:0s"/>
<circle cx="125" cy="68" r="24" fill="#0e273b" stroke="url(#ac)" stroke-width="1.5"/><g transform="translate(115 58) scale(0.8333)" fill="none" stroke="#7ce4cf" stroke-width="2.04" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></g>
<text x="125" y="28" font-size="11.5" font-weight="700" fill="#7ce4cf" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1">01</text>
<text x="125" y="124" font-size="17.5" font-weight="600" fill="#f2f8fc" text-anchor="middle">Pahami proses</text>
<text x="125" y="147" font-size="13.5" fill="#b7cbda" text-anchor="middle">Kebutuhan &amp; alur kerja</text>
<circle cx="375" cy="68" r="24" fill="none" stroke="#7ce4cf" stroke-width="1.5" class="halo" style="animation-delay:1.5s"/>
<circle cx="375" cy="68" r="24" fill="#0e273b" stroke="url(#ac)" stroke-width="1.5"/><g transform="translate(365 58) scale(0.8333)" fill="none" stroke="#7ce4cf" stroke-width="2.04" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></g>
<text x="375" y="28" font-size="11.5" font-weight="700" fill="#7ce4cf" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1">02</text>
<text x="375" y="124" font-size="17.5" font-weight="600" fill="#f2f8fc" text-anchor="middle">Hubungkan sistem</text>
<text x="375" y="147" font-size="13.5" fill="#b7cbda" text-anchor="middle">Data &amp; integrasi API</text>
<circle cx="625" cy="68" r="24" fill="none" stroke="#7ce4cf" stroke-width="1.5" class="halo" style="animation-delay:3s"/>
<circle cx="625" cy="68" r="24" fill="#0e273b" stroke="url(#ac)" stroke-width="1.5"/><g transform="translate(615 58) scale(0.8333)" fill="none" stroke="#7ce4cf" stroke-width="2.04" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></g>
<text x="625" y="28" font-size="11.5" font-weight="700" fill="#7ce4cf" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1">03</text>
<text x="625" y="124" font-size="17.5" font-weight="600" fill="#f2f8fc" text-anchor="middle">Otomatisasi</text>
<text x="625" y="147" font-size="13.5" fill="#b7cbda" text-anchor="middle">Validasi &amp; sinkronisasi</text>
<circle cx="875" cy="68" r="24" fill="none" stroke="#7ce4cf" stroke-width="1.5" class="halo" style="animation-delay:4.5s"/>
<circle cx="875" cy="68" r="24" fill="#0e273b" stroke="url(#ac)" stroke-width="1.5"/><g transform="translate(865 58) scale(0.8333)" fill="none" stroke="#7ce4cf" stroke-width="2.04" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"/></g>
<text x="875" y="28" font-size="11.5" font-weight="700" fill="#7ce4cf" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1">04</text>
<text x="875" y="124" font-size="17.5" font-weight="600" fill="#f2f8fc" text-anchor="middle">Evaluasi hasil</text>
<text x="875" y="147" font-size="13.5" fill="#b7cbda" text-anchor="middle">Laporan &amp; perbaikan</text>
</g>
</svg>
