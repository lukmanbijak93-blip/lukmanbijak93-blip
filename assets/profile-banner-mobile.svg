<svg xmlns="http://www.w3.org/2000/svg" width="440" height="308" viewBox="0 0 440 308" role="img" aria-labelledby="title desc">
<title id="title">Lukman Bijak Bestari</title>
<desc id="desc">Trainer Accurate Online dan developer sistem bisnis.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06121f"/><stop offset="1" stop-color="#0c2539"/></linearGradient>
<linearGradient id="ac" x2="1"><stop stop-color="#45b9f7"/><stop offset="1" stop-color="#7ce4cf"/></linearGradient>
<linearGradient id="cs" x2="0" y2="1"><stop stop-color="#2f5d79"/><stop offset="1" stop-color="#1b3a51"/></linearGradient>
<linearGradient id="csf" x2="0" y2="1"><stop stop-color="#4f9bb0"/><stop offset="1" stop-color="#28607a"/></linearGradient>
<linearGradient id="cf" x2="1"><stop stop-color="#12364d"/><stop offset="1" stop-color="#0f2c42"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#2f8fc0" stop-opacity=".3"/><stop offset="1" stop-color="#2f8fc0" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#a6d8ec" fill-opacity=".13"/></pattern>
<linearGradient id="fade" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".75" stop-color="#fff" stop-opacity=".1"/></linearGradient>
<mask id="fm"><rect width="440" height="308" fill="url(#fade)"/></mask>
<clipPath id="clip"><rect width="440" height="308" rx="20"/></clipPath>
</defs>
<style>.in{animation:in .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.55}70%,to{transform:scale(2.9);opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) .3s both}
@keyframes grow{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g clip-path="url(#clip)">
<rect width="440" height="308" fill="url(#bg)"/>
<rect width="440" height="308" fill="url(#dots)" mask="url(#fm)"/>
<circle cx="404" cy="34" r="190" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="439" height="307" rx="19.5" fill="none" stroke="#1e3d56"/>
<g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<g fill="none" stroke="#7fd0e6"><circle cx="404" cy="34" r="58" stroke-opacity=".14"/><circle cx="404" cy="34" r="96" stroke-opacity=".2" stroke-dasharray="2 10"/></g>
<g class="in">
<rect x="24" y="24" width="312" height="28" rx="14" fill="#0e273b" stroke="#234861"/>
<circle cx="40" cy="38" r="3" fill="#7ce4cf" class="ping"/><circle cx="40" cy="38" r="3" fill="#7ce4cf"/><text x="53" y="42" font-size="10.5" font-weight="700" fill="#b6e9ec" font-family="ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace" letter-spacing="1.2">BUSINESS SYSTEMS · DATA · AUTOMATION</text>
</g>
<g class="in" style="animation-delay:0.12s"><text x="23" y="110" font-size="42" font-weight="700" fill="#f2f8fc" letter-spacing="-0.4">Lukman Bijak</text><text x="23" y="156" font-size="42" font-weight="700" fill="#f2f8fc" letter-spacing="-0.4">Bestari</text></g>
<g class="in" style="animation-delay:0.24s">
<rect x="24" y="176" width="64" height="3" rx="1.5" fill="url(#ac)" class="grow"/>
<text x="24" y="212" font-size="17" fill="#c6dce8">Trainer Accurate Online</text><text x="24" y="236" font-size="17" fill="#c6dce8">Developer Sistem Bisnis</text>
</g>
<g class="in" style="animation-delay:0.36s"><g transform="translate(24 258)"><rect width="106" height="26" rx="13" fill="#0e273b" stroke="#234861"/><text x="53" y="17.32" font-size="12" font-weight="600" fill="#b7cbda" text-anchor="middle">Integrasi API</text></g><g transform="translate(136 258)"><rect width="92" height="26" rx="13" fill="#0e273b" stroke="#234861"/><text x="46" y="17.32" font-size="12" font-weight="600" fill="#b7cbda" text-anchor="middle">Otomatisasi</text></g><g transform="translate(234 258)"><rect width="79" height="26" rx="13" fill="#0e273b" stroke="#234861"/><text x="39.5" y="17.32" font-size="12" font-weight="600" fill="#b7cbda" text-anchor="middle">Pelaporan</text></g><g transform="translate(319 258)"><rect width="79" height="26" rx="13" fill="#0e273b" stroke="#234861"/><text x="39.5" y="17.32" font-size="12" font-weight="600" fill="#b7cbda" text-anchor="middle">Pelatihan</text></g></g>
</g>
</svg>
